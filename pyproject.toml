[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "i3-rice-gui"
version = "0.1.0"
description = "A graphical setup and customization tool for i3"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
i3-rice-gui = "i3_rice_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
